<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RyukManga | دنیای انیمه و مانگا</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ۱. اینترو سینمایی (پرده لودینگ ویدئویی) -->
  <div id="intro-screen">
    <video autoplay muted playsinline id="intro-video">
      <source src="hero.mp4" type="video/mp4">
    </video>
    <div class="intro-overlay">
      <h1 class="glitch-text">RYUKMANGA</h1>
      <p>دنیای تاریک و هیجان‌انگیز انیمه و مانگا</p>
    </div>
  </div>

  <!-- ۲. بدنه و محتوای اصلی سایت -->
  <div id="main-content">
    <!-- نوبار بالا -->
    <header class="navbar">
      <div class="logo">RYUK<span>MANGA</span></div>
      <nav class="nav-links">
        <a href="#" class="active">خانه</a>
        <a href="#">مانگاها</a>
        <a href="#">انیمه‌ها</a>
        <a href="#">برترین‌ها</a>
        <a href="#">تالارها</a>
        <a href="#">موسیقی</a>
      </nav>

      <div class="nav-actions">
        <input type="text" placeholder="جستجوی مانگا..." class="search-input">
        <button class="btn-primary" id="openAuthBtn">ورود / ثبت‌نام</button>
      </div>
    </header>

    <!-- بخش اصلی معرفی و محتوا -->
    <main class="content-container">
      <section class="banner">
        <h2>🔥 داغ‌ترین مانگاهای این هفته</h2>
        <p>جدیدترین چپترها را با بالاترین کیفیت و ترجمه اختصاصی بخوانید.</p>
      </section>

      <!-- بخش مانگاها -->
      <section class="manga-grid">
        <div class="manga-card">
          <div class="manga-cover cover-1"></div>
          <h3>Death Note</h3>
          <span>چپتر ۱۰۸ (پایان)</span>
        </div>
      </section>
    </main>
  </div>

  <!-- ۳. پاپ‌آپ شیک ورود و ثبت‌نام -->
  <div class="auth-modal-overlay" id="authModal">
    <div class="auth-modal">
      <button class="modal-close" id="closeAuthBtn">&times;</button>
      
      <div class="auth-tabs">
        <button class="tab-btn active" id="loginTab">ورود</button>
        <button class="tab-btn" id="registerTab">ثبت‌نام</button>
      </div>

      <!-- فرم ورود -->
      <form class="auth-form active" id="loginForm">
        <div class="input-group">
          <label>ایمیل یا نام کاربری</label>
          <input type="text" placeholder=" required>
        </div>
        <button type="submit" class="auth-submit-btn">ورود به قلمرو</button>
      </form>

      <!-- فرم ثبت‌نام -->
      <form class="auth-form" id="registerForm">
        <div class="input-group">
          <label>نام کاربری</label>
          <input type="text" placeholder="نام مستعار شما" required>
        </div>
        <div class="input-group">
          <label>ایمیل</label>
          <input type="email" placeholder="you@example.com" required>
        </div>
        <div class="input-group
        <div class="input-group">
          <label>ایمیل</label>
          <input type="email" placeholder="you@example.com" required>
        </div>
        <div class="input-group">
          <label>رمز عبور</label>
          <input type="password" placeholder="حداقل ۶ کاراکتر" required>
        </div>
        <button type="submit" class="auth-submit-btn">پیوستن به RyukManga</button>
      </form>
    </div>
  </div>

  <!-- ۴. اسکریپت‌ها -->
  <script>
    // کنترل اینترو
    window.addEventListener('load', () => {
      setTimeout(() => {
        const intro = document.getElementById('intro-screen');
        if (intro) {
          intro.classList.add('fade-out');
          setTimeout(() => {
            intro.style.display = 'none';
          }, 1000);
        }
      }, 5000);
    });

    // کنترل پاپ‌آپ ورود و ثبت‌نام
    const authModal = document.getElementById('authModal');
    const openAuthBtn = document.getElementById('openAuthBtn');
    const closeAuthBtn = document.getElementById('closeAuthBtn');
    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');

    // باز کردن مدال
    if(openAuthBtn) {
      openAuthBtn.addEventListener('click', () => {
        authModal.classList.add('active');
      });
    }

    // بستن مدال با دکمه ضربدر
    if(closeAuthBtn) {
      closeAuthBtn.addEventListener('click', () => {
        authModal.classList.remove('active');
      });
    }

    // بستن مدال با کلیک در پس‌زمینه
    window.addEventListener('click', (e) => {
      if (e.target === authModal) {
        authModal.classList.remove('active');
      }
    });

    // سوییچ به تب ورود
    if(loginTab && registerTab) {
      loginTab.addEventListener('click', () => {
        loginTab.classList.add('active');
        registerTab.classList.remove('active');
        loginForm.classList.add('active');
        registerForm.classList.remove('active');
      });

      // سوییچ به تب ثبت‌نام
      registerTab.addEventListener('click', () => {
        registerTab.classList.add('active');
        loginTab.classList.remove('active');
        registerForm.classList.add('active');
        loginForm.classList.remove('active');
      });
    }
  </script>
</body>
</html>
