<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RyukManga | دنیای انیمه</title>
    <!-- استایل‌های اصلی تو -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* تنظیمات ضروری برای نمایش اینترو */
        #intro-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; background: #000; display: flex; align-items: center; justify-content: center; transition: opacity 1s ease; }
        #intro-video { width: 100%; height: 100%; object-fit: cover; }
        .fade-out { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <!-- ۱. اینترو سینمایی -->
    <div id="intro-screen">
        <video id="intro-video" autoplay muted playsinline>
            <source src="hero.mp4" type="video/mp4">
        </video>
    </div>

    <!-- ۲. محتوای سایت -->
    <div id="main-content">
        <header class="navbar">
            <div class="logo">RYUK<span>MANGA</span></div>
            <nav class="nav-links">
                <a href="#">خانه</a>
                <a href="#">مانگاها</a>
            </nav>
            <button id="openAuthBtn" class="btn-primary">ورود / ثبت‌نام</button>
        </header>
        
        <main>
            <h1>به دنیای ریوک خوش آمدی!</h1>
            <p>چپترهای جدید منتظر تو هستند.</p>
        </main>
    </div>

    <!-- ۳. مدال لاگین/ثبت‌نام -->
    <div id="authModal" style="display:none; position:fixed; top:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000;">
        <div class="auth-modal">
            <button id="closeAuthBtn">بستن</button>
            <form id="authForm">
                <input type="email" id="email" placeholder="ایمیل" required>
                <input type="password" id="password" placeholder="رمز عبور" required>
                <button type="submit">تأیید</button>
            </form>
        </div>
    </div>

    <!-- ۴. اسکریپت اصلی و یکپارچه -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // --- تنظیمات Supabase ---
        const SUPABASE_URL = 'https://rskhmhjhpmopasjexraw.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_DpeDtLgdVA587x3_9SU4DQ_7mGHqClk';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log('اتصال برقرار شد 🍎');

        // --- منطق اینترو (دقیقاً ۵ ثانیه) ---
        const introScreen = document.getElementById('intro-screen');
        const startTime = Date.now();
        const MIN_TIME = 5000;

        function finishIntro() {
            const elapsed = Date.now() - startTime;
            const delay = Math.max(0, MIN_TIME - elapsed);
            
            setTimeout(() => {
                introScreen.classList.add('fade-out');
                setTimeout(() => introScreen.style.display = 'none', 1000);
            }, delay);
        }

        // رویدادهای خروج از اینترو
        window.addEventListener('load', finishIntro);
        document.getElementById('intro-video').addEventListener('ended', finishIntro);
        setTimeout(finishIntro, 8000); // Fail-safe (اگر تا ۸ ثانیه لود نشد، بزور ببند)

        // --- منطق ساده ورود ---
        const modal = document.getElementById('authModal');
        document.getElementById('openAuthBtn').onclick = () => modal.style.display = 'block';
        document.getElementById('closeAuthBtn').onclick = () => modal.style.display = 'none';

        document.getElementById('authForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
            if(error) alert('خطا: ' + error.message);
            else { alert('خوش برگشتی دادا!'); modal.style.display = 'none'; }
        };
    </script>
</body>
</html>
