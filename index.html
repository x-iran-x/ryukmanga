<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RyukManga | دنیای انیمه و مانگا</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ۱. اینترو سینمایی (پرده لودینگ ویدئویی) -->
  <div id="intro-screen">
    <video autoplay muted playsinline id="intro-video">
      <source src="hero.mp4" type="video/mp4">
    </video>
    <div class="intro-overlay">
      <h1 class="glitch-text">RYUKMANGA</h1>
      <p>دنیای تاریک و هیجان‌انگیز انیمه و مانگا</p>
    </div>
  </div>

  <!-- ۲. بدنه و محتوای اصلی سایت -->
  <div id="main-content">
    <!-- نوبار بالا -->
    <header class="navbar">
      <div class="logo">RYUK<span>MANGA</span></div>
      <nav class="nav-links">
        <a href="#" class="active">خانه</a>
        <a href="#">مانگاها</a>
        <a href="#">انیمه‌ها</a>
        <a href="#">برترین‌ها</a>
      </nav>
      <div class="nav-actions">
        <input type="text" placeholder="جستجوی مانگا..." class="search-input">
        <button class="btn-login">ورود / ثبت‌نام</button>
      </div>
    </header>

    <!-- بخش اصلی معرفی و محتوا -->
    <main class="content-container">
      <section class="banner">
        <h2>🔥 داغ‌ترین مانگاهای این هفته</h2>
        <p>جدیدترین چپترها را با بالاترین کیفیت و ترجمه اختصاصی بخوانید.</p>
      </section>

          <!-- بخش مانگاها -->
      <section class="manga-grid">
        <div class="manga-card">
          <div class="manga-cover cover-1"></div>
          <h3>Death Note</h3>
          <span>چپتر ۱۰۸ (پایان)</span>
        </div>
      </section>

  <!-- اسکریپت کنترل اینترو -->
  <script>
    window.addEventListener('load', () => {
      // بعد از ۵ ثانیه اینترو محو میشه و سایت باز میشه
      setTimeout(() => {
        const intro = document.getElementById('intro-screen');
        intro.classList.add('fade-out');
        setTimeout(() => {
          intro.style.display = 'none';
        }, 1000); // زمان پایان کامل ترنزیشن
      }, 5000);
    });
  </script>
</body>
</html>
