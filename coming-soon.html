<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1015">
  <title>به‌زودی در دسترس | RyukManga</title>
  <link rel="icon" type="image/svg+xml" href="/ryuk-favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 32px 20px; background: #0f1015; color: #f5f5f7; font-family: 'Vazirmatn', sans-serif; display: grid; place-items: center; }
    .wrapper { width: min(100%, 760px); display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; }
    img { display: block; width: 100%; max-width: 620px; max-height: 65vh; object-fit: contain; }
    h1 { margin: 0; font-size: clamp(1.5rem, 4vw, 2.25rem); }
    p { margin: 0; color: #a7a7b3; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 10px 22px; border-radius: 12px; background: #e11d2e; color: white; text-decoration: none; font-weight: 700; transition: background .2s, transform .2s; }
    a:hover { background: #ff334b; transform: translateY(-2px); }
  </style>
</head>
<body>
  <main class="wrapper">
    <img src="/ryuk-coming-soon.png" alt="این بخش به‌زودی در دسترس قرار می‌گیرد">
    <h1>این بخش به‌زودی در دسترس قرار می‌گیرد</h1>
    <p>داریم این بخش از دنیای RyukManga رو آماده می‌کنیم. به‌زودی برمی‌گردیم!</p>
    <a href="/">بازگشت به خانه</a>
  </main>
</body>
</html>
