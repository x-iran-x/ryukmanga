backend:
  name: github
  repo: x-iran-x/ryukmanga-media
  branch: main
  base_url: https://YOUR-OAUTH-SERVICE.example.com
  auth_endpoint: auth

site_url: https://ryukmanga.vercel.app
display_url: https://ryukmanga.vercel.app
publish_mode: editorial_workflow
media_folder: media
public_folder: /media
locale: fa

collections:
  - name: manga
    label: "مانگاها"
    label_singular: "مانگا"
    folder: _data/manga
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: slug
    summary: "{{title_fa}} ({{title}})"
    fields:
      - { name: slug, label: "شناسه انگلیسی (slug)", widget: string, required: true }
      - { name: title, label: "نام انگلیسی", widget: string, required: true }
      - { name: title_fa, label: "نام فارسی", widget: string, required: true }
      - { name: cover, label: "جلد", widget: image, required: false, media_folder: /media/covers, public_folder: /media/covers }
      - { name: volumes_count, label: "تعداد جلدها", widget: number, value_type: int, required: false }
      - name: genres
        label: "ژانرها"
        widget: select
        multiple: true
        required: false
        options: ["اکشن", "ماجراجویی", "کمدی", "درام", "فانتزی", "ترسناک", "عاشقانه", "علمی‌تخیلی", "ورزشی", "رازآلود", "روانشناختی", "ماورایی", "تاریخی", "مدرسه‌ای", "شونن", "سینن", "شوجو", "جوسی"]
      - { name: author, label: "نویسنده", widget: string, required: false }
      - { name: status, label: "وضعیت انتشار", widget: select, required: false, options: ["در حال انتشار", "تکمیل‌شده", "متوقف‌شده"] }
      - { name: description, label: "خلاصه داستان", widget: text, required: false }
      - { name: draft, label: "پیش‌نویس (در سایت نمایش داده نشود)", widget: boolean, default: false, required: false }

  - name: volumes
    label: "جلدهای مانگا"
    label_singular: "جلد"
    folder: _data/volumes
    create: true
    extension: json
    format: json
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{manga}} — جلد {{number}}"
    fields:
      - { name: manga, label: "شناسه مانگا", widget: string, required: true }
      - { name: number, label: "شماره جلد", widget: number, value_type: int, required: true }
      - { name: download_file, label: "فایل PDF/ZIP", widget: file, required: false, media_folder: /media/files, public_folder: /media/files }
      - { name: download_link, label: "لینک دانلود خارجی", widget: string, required: false }
      - { name: read_link, label: "لینک مطالعه آنلاین", widget: string, required: false }

  - name: anime
    label: "انیمه‌ها"
    label_singular: "انیمه"
    folder: _data/anime
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: slug
    summary: "{{title_fa}} ({{title}})"
    fields:
      - { name: slug, label: "شناسه انگلیسی (slug)", widget: string, required: true }
      - { name: title, label: "نام انگلیسی", widget: string, required: true }
      - { name: title_fa, label: "نام فارسی", widget: string, required: true }
      - { name: poster, label: "پوستر", widget: image, required: false, media_folder: /media/posters, public_folder: /media/posters }
      - { name: episodes_count, label: "تعداد قسمت‌ها", widget: number, value_type: int, required: false }
      - name: genres
        label: "ژانرها"
        widget: select
        multiple: true
        required: false
        options: ["اکشن", "ماجراجویی", "کمدی", "درام", "فانتزی", "ترسناک", "عاشقانه", "علمی‌تخیلی", "ورزشی", "رازآلود", "روانشناختی", "ماورایی", "تاریخی", "مدرسه‌ای", "شونن", "سینن", "شوجو", "جوسی"]
      - { name: studio, label: "استودیو", widget: string, required: false }
      - { name: year, label: "سال انتشار", widget: number, value_type: int, required: false }
      - { name: status, label: "وضعیت پخش", widget: select, required: false, options: ["در حال پخش", "تکمیل‌شده", "متوقف‌شده"] }
      - { name: description, label: "خلاصه داستان", widget: text, required: false }
      - { name: draft, label: "پیش‌نویس (در سایت نمایش داده نشود)", widget: boolean, default: false, required: false }

  - name: episodes
    label: "قسمت‌های انیمه"
    label_singular: "قسمت"
    folder: _data/episodes
    create: true
    extension: json
    format: json
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{anime}} — قسمت {{number}} — {{quality}}"
    fields:
      - { name: anime, label: "شناسه انیمه", widget: string, required: true }
      - { name: number, label: "شماره قسمت", widget: number, value_type: int, required: true }
      - { name: quality, label: "کیفیت", widget: select, required: false, options: ["480p", "720p", "1080p"] }
      - { name: audio, label: "زبان/زیرنویس", widget: select, required: false, options: ["زیرنویس فارسی", "دوبله فارسی", "زیرنویس انگلیسی"] }
      - { name: download_link, label: "لینک دانلود", widget: string, required: false }
      - { name: watch_link, label: "لینک تماشا", widget: string, required: false }
      - { name: intro_start, label: "شروع اینترو (ثانیه)", widget: number, required: false }
      - { name: intro_end, label: "پایان اینترو (ثانیه)", widget: number, required: false }
      - { name: outro_start, label: "شروع اوترو (ثانیه)", widget: number, required: false }
      - { name: outro_end, label: "پایان اوترو (ثانیه)", widget: number, required: false }

  - name: music
    label: "موسیقی‌ها"
    label_singular: "موسیقی"
    folder: _data/music
    create: true
    extension: json
    format: json
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{title}} — {{source}}"
    fields:
      - { name: title, label: "نام موسیقی", widget: string, required: true }
      - { name: source, label: "منبع (مثلاً Death Note OST)", widget: string, required: true }
      - { name: artist, label: "خواننده/آهنگساز", widget: string, required: false }
      - { name: type, label: "نوع", widget: select, options: ["OST", "اوپنینگ", "اندینگ", "اینسرت سانگ"], required: true }
      - { name: artwork, label: "کاور", widget: image, required: false, media_folder: /media/artwork, public_folder: /media/artwork }
      - { name: icon, label: "ایموجی جایگزین کاور", widget: string, required: false }
      - { name: audio_file, label: "فایل صوتی", widget: file, required: false, media_folder: /media/audio, public_folder: /media/audio }
      - { name: audio_link, label: "لینک مستقیم صوت", widget: string, required: false }
      - { name: draft, label: "پیش‌نویس", widget: boolean, default: false, required: false }

  - name: mv
    label: "موزیک‌ویدیوها"
    label_singular: "موزیک‌ویدیو"
    folder: _data/mv
    create: true
    extension: json
    format: json
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{title}} — {{source}}"
    fields:
      - { name: title, label: "نام ویدیو", widget: string, required: true }
      - { name: source, label: "منبع", widget: string, required: true }
      - { name: artist, label: "هنرمند", widget: string, required: false }
      - { name: type, label: "نوع", widget: string, required: false }
      - { name: artwork, label: "کاور", widget: image, required: false, media_folder: /media/artwork, public_folder: /media/artwork }
      - { name: video_file, label: "فایل ویدیو", widget: file, required: false, media_folder: /media/videos, public_folder: /media/videos }
      - { name: video_link, label: "لینک ویدیو", widget: string, required: false }
      - { name: draft, label: "پیش‌نویس", widget: boolean, default: false, required: false }

  - name: articles
    label: "مقاله‌ها"
    label_singular: "مقاله"
    folder: _data/articles
    create: true
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: slug
    summary: "{{title_fa}}"
    fields:
      - { name: slug, label: "شناسه انگلیسی (slug)", widget: string, required: true }
      - { name: title, label: "عنوان انگلیسی", widget: string, required: false }
      - { name: title_fa, label: "عنوان فارسی", widget: string, required: true }
      - { name: cover, label: "تصویر مقاله", widget: image, required: false, media_folder: /media/artwork, public_folder: /media/artwork }
      - { name: summary, label: "خلاصه", widget: text, required: false }
      - { name: body, label: "متن مقاله", widget: markdown, required: true }
      - { name: author, label: "نویسنده", widget: string, required: false }
      - { name: draft, label: "پیش‌نویس", widget: boolean, default: false, required: false }
