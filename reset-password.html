<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1015">
  <title>بازیابی رمز عبور | RyukManga</title>
  <link rel="icon" type="image/svg+xml" href="/ryuk-favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #0f1015; color: #f5f5f7; font-family: Vazirmatn, sans-serif; }
    main { width: min(100%, 520px); padding: 32px; border: 1px solid #34343f; border-radius: 22px; background: #181820; box-shadow: 0 24px 80px #0005; }
    .logo { margin: 0 0 20px; text-align: center; font-weight: 900; letter-spacing: .04em; font-size: 1.35rem; direction: ltr; }
    .logo span { color: #f04455; }
    h1 { margin: 0 0 12px; text-align: center; font-size: clamp(1.35rem, 5vw, 1.8rem); }
    p { color: #b9b9c5; line-height: 1.9; }
    label { display: block; margin: 16px 0 7px; font-weight: 600; }
    input { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid #424250; border-radius: 10px; background: #101017; color: white; font: inherit; }
    button, a { display: inline-flex; justify-content: center; align-items: center; min-height: 46px; padding: 10px 22px; border: 0; border-radius: 12px; background: #e11d2e; color: white; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    button { width: 100%; margin-top: 18px; }
    button:disabled { opacity: .65; cursor: wait; }
    a { margin-top: 12px; background: #292934; }
    #status { margin: 18px 0; padding: 12px; border-radius: 10px; background: #24242e; }
    #status[data-state="success"] { color: #86efac; }
    #status[data-state="error"] { color: #fda4af; }
  </style>
</head>
<body>
  <main>
    <p class="logo">RYUK<span>MANGA</span></p>
    <h1>ساخت رمز عبور جدید</h1>
    <p>رمز عبور تازه‌ای انتخاب کن. برای امنیت حساب، حداقل ۸ نویسه وارد کن.</p>
    <form id="resetForm">
      <label for="password">رمز عبور جدید</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="passwordAgain">تکرار رمز عبور</label>
      <input id="passwordAgain" name="passwordAgain" type="password" autocomplete="new-password" minlength="8" required>
      <button id="submitBtn" type="submit">ذخیرهٔ رمز عبور جدید</button>
    </form>
    <p id="status" role="status" aria-live="polite">لینک بازیابی را بررسی می‌کنیم…</p>
    <a href="/">بازگشت به سایت</a>
  </main>
  <script type="module">
    import { Account, Client } from 'https://cdn.jsdelivr.net/npm/appwrite@28.3.0/+esm';

    const client = new Client()
      .setEndpoint('https://fra.cloud.appwrite.io/v1')
      .setProject('6ad28bbc0023dee367ab');
    const account = new Account(client);
    const params = new URLSearchParams(window.location.search);
    const userId = params.get('userId');
    const secret = params.get('secret');
    const form = document.getElementById('resetForm');
    const password = document.getElementById('password');
    const passwordAgain = document.getElementById('passwordAgain');
    const submitBtn = document.getElementById('submitBtn');
    const status = document.getElementById('status');
    let linkValid = Boolean(userId && secret);

    function show(message, state) {
      status.textContent = message;
      status.dataset.state = state;
    }

    if (!linkValid) {
      show('لینک بازیابی ناقص است یا معتبر نیست. از صفحهٔ ورود دوباره درخواست بازیابی بده.', 'error');
      submitBtn.disabled = true;
    } else {
      show('لینک بازیابی آماده است. رمز عبور جدیدت را وارد کن.', 'success');
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (!linkValid) return;
      if (password.value.length < 8) {
        show('رمز عبور باید حداقل ۸ نویسه داشته باشد.', 'error');
        return;
      }
      if (password.value !== passwordAgain.value) {
        show('رمزهای عبور با هم یکسان نیستند.', 'error');
        passwordAgain.focus();
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = 'در حال ذخیره…';
      try {
        await account.updateRecovery({ userId, secret, password: password.value, passwordAgain: passwordAgain.value });
        show('رمز عبورت با موفقیت تغییر کرد. حالا می‌توانی از صفحهٔ اصلی وارد شوی. ✨', 'success');
        form.reset();
        linkValid = false;
      } catch (error) {
        console.error('RyukManga password recovery failed:', error);
        show('تغییر رمز عبور انجام نشد. ممکن است لینک منقضی یا قبلاً استفاده شده باشد؛ دوباره درخواست بازیابی بده.', 'error');
      } finally {
        submitBtn.disabled = !linkValid;
        submitBtn.textContent = 'ذخیرهٔ رمز عبور جدید';
      }
    });
  </script>
</body>
</html>
