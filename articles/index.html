<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="آخرین مقاله‌ها، اخبار و نقد و بررسی‌های RyukManga">
  <title>مقاله‌ها و اخبار | RyukManga</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="icon" type="image/svg+xml" href="/ryuk-favicon.svg">
  <style>
    .articles-wrap{max-width:1100px;margin:42px auto;padding:0 20px}
    .articles-heading{margin-bottom:26px}.articles-heading h1{font-size:clamp(1.7rem,4vw,2.5rem);margin-bottom:8px}.articles-heading p,.article-muted{color:#aaa}
    .articles-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
    .article-card{overflow:hidden;background:#15151c;border:1px solid #292934;border-radius:16px;transition:transform .2s,border-color .2s}
    .article-card:hover{transform:translateY(-4px);border-color:#e50914}
    .article-card-cover{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#20202a}
    .article-card-body{padding:18px}.article-category{color:#ff6670;font-size:.85rem;font-weight:700}.article-card h2{font-size:1.2rem;line-height:1.8;margin:8px 0}.article-card p{color:#bbb;line-height:1.9;margin-bottom:14px}
    .article-link{display:inline-block;color:#fff;text-decoration:none;background:#e50914;border-radius:8px;padding:8px 14px;font-weight:700}
    .article-status{padding:24px;border:1px solid #292934;border-radius:12px;color:#bbb;text-align:center}
    @media(max-width:600px){.articles-wrap{margin:28px auto}.articles-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div id="main-content">
    <header class="navbar">
      <div class="logo"><a href="../" style="text-decoration:none;color:inherit">RYUK<span>MANGA</span></a></div>
      <nav class="nav-links">
        <a href="../">خانه</a><a href="../manga/">مانگاها</a><a href="../anime/">انیمه‌ها</a><a href="../top/">برترین‌ها</a><a href="../forums/">تالارها</a><a href="../music/">موسیقی</a><a href="./" class="active">مقاله‌ها</a>
      </nav>
    </header>
    <main class="articles-wrap">
      <div class="articles-heading"><h1>مقاله‌ها و اخبار</h1><p>خبرها، نقدها و تحلیل‌های دنیای انیمه و مانگا</p></div>
      <div id="articlesGrid" class="articles-grid" aria-live="polite"><p class="article-status">در حال دریافت مقاله‌ها...</p></div>
    </main>
  </div>
  <script>
    const CATALOG_URL = 'https://x-iran-x.github.io/ryukmanga-media/catalog.json';
    const MEDIA_BASE = 'https://x-iran-x.github.io/ryukmanga-media/';
    const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function coverURL(path) {
      if (!path) return '';
      if (/^https?:\/\//i.test(path)) return path;
      return MEDIA_BASE + String(path).replace(/^\/+/, '');
    }
    (async () => {
      const grid = document.getElementById('articlesGrid');
      try {
        const response = await fetch(CATALOG_URL, {cache:'no-cache'});
        if (!response.ok) throw new Error('catalog request failed');
        const catalog = await response.json();
        const articles = (catalog.articles || []).map(item => ({slug:item.slug, ...(item.data || {})}))
          .filter(item => item.title && !item.draft)
          .sort((a,b) => String(b.published_at || '').localeCompare(String(a.published_at || '')));
        if (!articles.length) {
          grid.innerHTML = '<p class="article-status">هنوز مقاله‌ای منتشر نشده است. مقاله‌های منتشرشده از پنل مدیریت اینجا نمایش داده می‌شوند.</p>';
          return;
        }
        grid.innerHTML = articles.map(article => {
          const image = article.cover ? '<img class="article-card-cover" loading="lazy" src="' + escapeHTML(coverURL(article.cover)) + '" alt="" onerror="this.hidden=true">' : '';
          const category = article.category ? '<span class="article-category">' + escapeHTML(article.category) + '</span>' : '';
          const summary = article.summary ? '<p>' + escapeHTML(article.summary) + '</p>' : '';
          return '<article class="article-card">' + image + '<div class="article-card-body">' + category + '<h2>' + escapeHTML(article.title) + '</h2>' + summary + '<a class="article-link" href="view.html?slug=' + encodeURIComponent(article.slug || '') + '">ادامه مقاله</a></div></article>';
        }).join('');
      } catch (error) {
        grid.innerHTML = '<p class="article-status">فعلاً دریافت مقاله‌ها ممکن نیست. کمی بعد دوباره امتحان کن.</p>';
      }
    })();
  </script>
</body>
</html>
