<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e11d2e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e11d2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0d"/>
      <stop offset="1" stop-color="#1a0b10"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4252"/>
      <stop offset="1" stop-color="#a30f1d"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9b9c4"/>
    </linearGradient>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <circle cx="5" cy="5" r="2" fill="#ffffff" opacity="0.10"/>
    </pattern>
    <pattern id="dotsRed" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="4.5" cy="4.5" r="2.2" fill="#e11d2e" opacity="0.55"/>
    </pattern>
    <clipPath id="hexClip">
      <polygon points="0,-138 120,-69 120,69 0,138 -120,69 -120,-69"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1000" height="460" fill="url(#bg)"/>
  <rect width="1000" height="460" fill="url(#dots)"/>
  <!-- speed lines -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="2">
    <line x1="0" y1="60" x2="1000" y2="20"/><line x1="0" y1="120" x2="1000" y2="60"/>
    <line x1="0" y1="400" x2="1000" y2="440"/><line x1="0" y1="340" x2="1000" y2="400"/>
  </g>
  <circle cx="270" cy="230" r="230" fill="url(#glow)"/>

  <!-- emblem -->
  <g transform="translate(270,230)">
    <!-- wings -->
    <g id="wing" fill="#050507" stroke="#e11d2e" stroke-width="4" stroke-linejoin="miter">
      <path d="M-100,-30 L-250,-175 L-215,-95 L-270,-110 L-225,-35 L-265,-25 L-215,25 L-245,95 L-135,45 L-100,45 Z"/>
      <path d="M-100,-30 L-215,-95 M-100,-10 L-225,-35 M-100,10 L-215,25 M-100,30 L-245,95" stroke="#e11d2e" stroke-width="2" fill="none" opacity="0.7"/>
    </g>
    <g transform="scale(-1,1)" fill="#050507" stroke="#e11d2e" stroke-width="4" stroke-linejoin="miter">
      <path d="M-100,-30 L-250,-175 L-215,-95 L-270,-110 L-225,-35 L-265,-25 L-215,25 L-245,95 L-135,45 L-100,45 Z"/>
      <path d="M-100,-30 L-215,-95 M-100,-10 L-225,-35 M-100,10 L-215,25 M-100,30 L-245,95" stroke="#e11d2e" stroke-width="2" fill="none" opacity="0.7"/>
    </g>

    <!-- hexagon body -->
    <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75" fill="#e11d2e" opacity="0.35" filter="url(#soft)"/>
    <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75" fill="#101015" stroke="url(#red)" stroke-width="9" stroke-linejoin="miter"/>
    <g clip-path="url(#hexClip)">
      <rect x="-130" y="-150" width="260" height="300" fill="url(#dotsRed)"/>
      <circle cx="0" cy="0" r="92" fill="#101015"/>
      <polygon points="-130,60 130,-60 130,-20 -130,100" fill="#e11d2e" opacity="0.18"/>
    </g>
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" fill="none" stroke="#3a3a46" stroke-width="2.5"/>
    <circle r="92" fill="none" stroke="#f5f5f7" stroke-width="2" stroke-dasharray="3 7" opacity="0.7"/>

    <!-- crescent + sparks -->
    <path d="M40,-92 A46,46 0 1 0 40,-48 A36,36 0 1 1 40,-92 Z" fill="#f5f5f7" opacity="0.9" transform="translate(-6,-4) scale(0.5)"/>
    <g fill="#ffffff">
      <polygon points="-96,-48 -92,-58 -88,-48 -78,-44 -88,-40 -92,-30 -96,-40 -106,-44"/>
      <polygon points="98,38 101,31 104,38 111,41 104,44 101,51 98,44 91,41"/>
    </g>

    <!-- letter R -->
    <g transform="translate(0,6) scale(1.12) translate(-163,-162)">
      <path d="M109 94 H179 Q219 94 219 136 Q219 169 187 179 L226 239 H186 L152 182 H144 V239 H109 Z M144 122 V156 H176 Q186 156 186 139 Q186 122 176 122 Z" fill="#e11d2e" fill-rule="evenodd" transform="translate(5,5)"/>
      <path d="M105 90 H175 Q215 90 215 132 Q215 165 183 175 L222 235 H182 L148 178 H140 V235 H105 Z M140 118 V152 H172 Q182 152 182 135 Q182 118 172 118 Z" fill="url(#metal)" stroke="#0a0a0d" stroke-width="2.5" fill-rule="evenodd"/>
    </g>
    <!-- slash -->
    <polygon points="-125,70 135,-92 142,-80 -118,82" fill="#e11d2e"/>
    <polygon points="-125,70 135,-92 138,-87 -122,75" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- wordmark -->
  <g font-family="Impact, 'Arial Black', Arial, sans-serif" font-weight="900">
    <text x="486" y="250" font-size="170" fill="#e11d2e" letter-spacing="6">RYUK</text>
    <text x="478" y="242" font-size="170" fill="url(#metal)" stroke="#0a0a0d" stroke-width="3" letter-spacing="6">RYUK</text>
  </g>

  <!-- ink drips -->
  <g fill="#e11d2e">
    <rect x="482" y="262" width="440" height="7"/>
    <path d="M520,269 h9 v26 q-4.5,10 -9,0 Z"/>
    <path d="M640,269 h7 v14 q-3.5,8 -7,0 Z"/>
    <path d="M790,269 h10 v32 q-5,11 -10,0 Z"/>
    <circle cx="550" cy="283" r="4"/><circle cx="860" cy="288" r="3"/>
  </g>

  <!-- MANGA banner -->
  <polygon points="520,312 946,312 920,386 494,386" fill="#050507" stroke="#e11d2e" stroke-width="4"/>
  <polygon points="520,312 946,312 940,330 514,330" fill="#e11d2e" opacity="0.25"/>
  <text x="530" y="371" font-family="'Arial Black', Impact, Arial, sans-serif" font-size="58" font-weight="900" fill="#f5f5f7" letter-spacing="30">MANGA</text>
  <text x="900" y="304" font-family="'Yu Gothic','MS Gothic',sans-serif" font-size="24" font-weight="700" fill="#e11d2e" text-anchor="end" letter-spacing="8">漫画</text>

  <!-- corner ticks -->
  <g stroke="#e11d2e" stroke-width="4" fill="none">
    <path d="M20,50 V20 H50"/><path d="M950,20 H980 V50"/>
    <path d="M20,410 V440 H50"/><path d="M980,410 V440 H950"/>
  </g>
</svg>
