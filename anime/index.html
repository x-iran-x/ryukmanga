<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>انیمه‌ها | RyukManga</title>

  <!-- فونت وزیرمتن -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">

  <!-- استایل اصلی سایت -->
  <link rel="stylesheet" href="../style.css">

  <style>
    /* گرید ۳ ستونه برای کارت‌های انیمه */
    .anime-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      margin-top: 30px;
      max-width: 1000px;
      margin-left: auto;
      margin-right: auto;
    }

    /* واکنش‌گرایی: در تبلت ۲ ستونه و موبایل ۱ ستونه */
    @media (max-width: 850px) {
      .anime-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 550px) {
      .anime-grid {
        grid-template-columns: 1fr;
      }
    }

    /* کارت انیمه مطابق عکس */
    .anime-card {
      background: #121318;
      border: 1px solid #232630;
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer;
    }

    .anime-card:hover {
      transform: translateY(-6px);
      border-color: #ff334b;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }

    /* باکس عکس/پوستر بزرگ بالای کارت */
    .anime-poster {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #2a2224; /* جایگزین موقت تا عکس بذاری */
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6d7285;
      font-size: 2rem;
    }

    .anime-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* مشخصات و متن‌های زیر پوستر */
    .anime-info {
      padding: 14px 6px 4px 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .anime-title {
      margin: 0;
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .anime-episodes {
      margin: 0;
      color: #7a8093;
      font-size: 0.85rem;
      font-weight: 400;
    }
  </style>
</head>
<body>

  <div id="main-content">
    <!-- نوار ناوبری -->
    <header class="navbar">
      <div class="logo"><a href="../" style="text-decoration: none; color: inherit;">RYUK<span>MANGA</span></a></div>
      
      <nav class="nav-links">
        <a href="../">خانه</a>
        <a href="../manga/">مانگاها</a>
        <a href="./" class="active">انیمه‌ها</a>
        <a href="../top/">برترین‌ها</a>
        <a href="../forums/">تالارها</a>
        <a href="../music/">موسیقی</a>
      </nav>

      <div class="nav-actions">
        <input type="text" placeholder="جستجوی انیمه..." class="search-input">
      </div>
    </header>

    <main class="content-container">
      <section class="banner">
        <h2>🎬 آرشیو انیمه‌ها</h2>
        <p>تماشا و دانلود جدیدترین و برترین انیمه‌ها با کیفیت عالی.</p>
      </section>

      <!-- گرید ۳ ستونه کارت‌های انیمه -->
      <section class="anime-grid">
        
        <!-- انیمه ۱ -->
        <div class="anime-card">
          <div class="anime-poster">
            <!-- بعداً به جای این، تگ img میذاریم: <img src="link.jpg" alt="Chainsaw Man"> -->
            📺
          </div>
          <div class="anime-info">
            <h3 class="anime-title">Chainsaw Man</h3>
            <p class="anime-episodes">قسمت ۱۲</p>
          </div>
        </div>

        <!-- انیمه ۲ -->
        <div class="anime-card">
          <div class="anime-poster">
            🍎
          </div>
          <div class="anime-info">
            <h3 class="anime-title">Death Note</h3>
            <p class="anime-episodes">قسمت ۳۷</p>
          </div>
        </div>

        <!-- انیمه ۳ -->
        <div class="anime-card">
          <div class="anime-poster">
            ⚔️
          </div>
          <div class="anime-info">
            <h3 class="anime-title">Attack on Titan</h3>
            <p class="anime-episodes">قسمت ۸۹</p>
          </div>
        </div>

        <!-- انیمه ۴ -->
        <div class="anime-card">
          <div class="anime-poster">
            🔥
          </div>
          <div class="anime-info">
            <h3 class="anime-title">Jujutsu Kaisen</h3>
            <p class="anime-episodes">قسمت ۴۷</p>
          </div>
        </div>

        <!-- انیمه ۵ -->
        <div class="anime-card">
          <div class="anime-poster">
            🗡️
          </div>
          <div class="anime-info">
            <h3 class="anime-title">Demon Slayer</h3>
            <p class="anime-episodes">قسمت ۵۵</p>
          </div>
        </div>

        <!-- انیمه ۶ -->
        <div class="anime-card">
          <div class="anime-poster">
            🥋
          </div>
          <div class="anime-info">
            <h3 class="anime-title">Solo Leveling</h3>
            <p class="anime-episodes">قسمت ۱۲</p>
          </div>
        </div>

      </section>
    </main>
  </div>

</body>
</html>
