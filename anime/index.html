<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>انیمه‌ها | RyukManga</title>

  <!-- فونت وزیرمتن -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">

  <!-- استایل اصلی سایت -->
  <link rel="stylesheet" href="../style.css">
  <!-- استایل اختصاصی صفحه انیمه -->
  <link rel="stylesheet" href="anime.css">
</head>
<body>

  <div id="main-content">
    <!-- نوار ناوبری -->
    <header class="navbar">
      <div class="logo"><a href="../" style="text-decoration: none; color: inherit;">RYUK<span>MANGA</span></a></div>

      <nav class="nav-links">
        <a href="../">خانه</a>
        <a href="../manga/">مانگاها</a>
        <a href="./" class="active">انیمه‌ها</a>
        <a href="../top/">برترین‌ها</a>
        <a href="../forums/">تالارها</a>
        <a href="../music/">موسیقی</a>
      </nav>

      <div class="nav-actions">
        <input type="text" placeholder="جستجوی انیمه..." class="search-input">
      </div>
    </header>

    <main class="content-container">
      <section class="banner">
        <h2>🎬 آرشیو انیمه‌ها</h2>
        <p>تماشا و دانلود جدیدترین و برترین انیمه‌ها با کیفیت عالی.</p>
      </section>

      <!-- نوار فیلتر ژانر (با جاوااسکریپت پر می‌شود) -->
      <div class="filter-bar" id="filterBar"></div>

      <!-- گرید کارت‌های انیمه (با جاوااسکریپت پر می‌شود) -->
      <section class="anime-grid" id="animeGrid"></section>
    </main>
  </div>

  <script src="../media-config.js"></script>

  <!-- منطق رندر و فیلتر -->
  <script>
    const animeGrid = document.getElementById('animeGrid');
    const filterBar = document.getElementById('filterBar');
    const searchInput = document.querySelector('.search-input');

    let animeList = [];
    let activeGenre = 'همه';
    let searchText = '';

    async function init() {
      try {
        animeList = await loadAnime();
      } catch (err) {
        animeGrid.innerHTML = `<div class="empty-state">خطا در بارگذاری لیست انیمه‌ها (${escapeHtml(err.message)})</div>`;
        return;
      }
      renderFilters();
      renderCards();
    }

    function getAllGenres(list) {
      const genres = new Set();
      list.forEach(item => (item.genres || []).forEach(g => genres.add(g)));
      return ['همه', ...genres];
    }

    function renderFilters() {
      const genres = getAllGenres(animeList);

      filterBar.innerHTML = genres.map(genre => `
        <button
          type="button"
          class="filter-btn ${genre === activeGenre ? 'active' : ''}"
          data-genre="${escapeHtml(genre)}"
        >
          ${escapeHtml(genre)}
        </button>
      `).join('');

      filterBar.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeGenre = btn.dataset.genre;
          renderFilters();
          renderCards();
        });
      });
    }

    searchInput.addEventListener('input', () => {
      searchText = searchInput.value.trim().toLowerCase();
      renderCards();
    });

    function renderCards() {
      if (animeList.length === 0) {
        animeGrid.innerHTML = `<div class="empty-state">هنوز انیمه‌ای اضافه نشده.</div>`;
        return;
      }

      const filtered = animeList.filter(item => {
        const genreOk = activeGenre === 'همه' || (item.genres || []).includes(activeGenre);
        const textOk = !searchText ||
          String(item.title || '').toLowerCase().includes(searchText) ||
          String(item.title_fa || '').toLowerCase().includes(searchText);
        return genreOk && textOk;
      });

      if (filtered.length === 0) {
        animeGrid.innerHTML = `<div class="empty-state">موردی پیدا نشد.</div>`;
        return;
      }

      animeGrid.innerHTML = filtered.map(item => `
        <a href="view.html?id=${encodeURIComponent(item.slug)}" class="anime-card">
          <div class="anime-poster">
            ${item.poster ? `<img src="${escapeHtml(mediaUrl(item.poster))}" alt="${escapeHtml(item.title)}" loading="lazy">` : '📺'}
          </div>
          <div class="anime-info">
            <h3 class="anime-title">${escapeHtml(item.title)}</h3>
            <p class="anime-episodes">${item.title_fa ? escapeHtml(item.title_fa) + ' · ' : ''}قسمت ${escapeHtml(item.episodes_count || item.episodes.length || 0)}</p>
          </div>
        </a>
      `).join('');
    }

    init();
  </script>

  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
