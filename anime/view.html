<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>انیمه | RyukManga</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="view.css">
  <link rel="icon" type="image/svg+xml" href="/ryuk-favicon.svg">
</head>
<body>

  <div id="main-content">
    <header class="navbar">
      <div class="logo"><a href="../" style="text-decoration: none; color: inherit;">RYUK<span>MANGA</span></a></div>

      <nav class="nav-links">
        <a href="../">خانه</a>
        <a href="../manga/">مانگاها</a>
        <a href="./" class="active">انیمه‌ها</a>
        <a href="../top/">برترین‌ها</a>
        <a href="../forums/">تالارها</a>
        <a href="../music/">موسیقی</a>
      </nav>
    </header>

    <main class="content-container" id="pageContent">
      <p class="loading-state">در حال بارگذاری...</p>
    </main>
  </div>

  <script src="../media-config.js"></script>
  <script src="https://cdn.dashjs.org/latest/modern/umd/dash.all.min.js"></script>
  <script>
    const pageContent = document.getElementById('pageContent');
    let dashPlayer = null;
    let activeEpisodeKey = '';
    let resumePromptShown = false;

    // خواندن شناسه انیمه از آدرس صفحه (مثلاً view.html?id=death-note)
    const animeId = new URLSearchParams(window.location.search).get('id');

    async function init() {
      if (!animeId) {
        pageContent.innerHTML = `<p class="loading-state">شناسه انیمه مشخص نیست.</p>`;
        return;
      }

      let list;
      try {
        list = await loadAnime();
      } catch (err) {
        pageContent.innerHTML = `<p class="loading-state">خطا در بارگذاری (${escapeHtml(err.message)})</p>`;
        return;
      }

      const anime = list.find(a => a.slug === animeId);
      if (!anime) {
        pageContent.innerHTML = `<p class="loading-state">این انیمه پیدا نشد.</p>`;
        return;
      }

      document.title = anime.title + ' | RyukManga';
      renderPage(anime);
    }

    function isDirectVideo(url) {
      const value = String(url || '');
      return /\.(mp4|webm|m3u8|mpd)(?:$|[?#])/i.test(value) || /\/dash\/[^?#]+(?:dashinit|\.mpd)(?:$|[?#])/i.test(value);
    }

    function destroyDashPlayer() {
      if (dashPlayer) {
        try { dashPlayer.reset(); } catch (_) {}
        dashPlayer = null;
      }
    }

    function formatPlayerTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return '00:00';
      const value = Math.floor(seconds);
      const hours = Math.floor(value / 3600);
      const minutes = Math.floor((value % 3600) / 60);
      const secs = value % 60;
      return hours
        ? `${hours}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`
        : `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function syncPlayerControls() {
      const video = document.getElementById('animeVideo');
      const playButton = document.getElementById('playerPlay');
      const playIcon = document.getElementById('playerPlayIcon');
      const playLabel = document.getElementById('playerPlayLabel');
      const seek = document.getElementById('playerSeek');
      const current = document.getElementById('playerCurrent');
      const duration = document.getElementById('playerDuration');
      const muteButton = document.getElementById('playerMute');
      const volume = document.getElementById('playerVolume');
      if (!video || !playButton || !seek) return;

      const playing = !video.paused && !video.ended;
      playButton.setAttribute('aria-label', playing ? 'توقف موقت' : 'پخش');
      playButton.title = playing ? 'توقف موقت' : 'پخش';
      if (playIcon) playIcon.textContent = playing ? 'Ⅱ' : '▶';
      if (playLabel) playLabel.textContent = playing ? 'توقف' : 'پخش';

      const total = Number.isFinite(video.duration) ? video.duration : 0;
      const now = Number.isFinite(video.currentTime) ? video.currentTime : 0;
      seek.max = String(total || 0);
      seek.value = String(Math.min(now, total || now));
      seek.style.setProperty('--seek-progress', total ? `${(now / total) * 100}%` : '0%');
      seek.disabled = !total;
      if (current) current.textContent = formatPlayerTime(now);
      if (duration) duration.textContent = formatPlayerTime(total);

      const muted = video.muted || video.volume === 0;
      if (muteButton) {
        muteButton.textContent = muted ? '🔇' : '🔊';
        muteButton.setAttribute('aria-label', muted ? 'فعال کردن صدا' : 'بی‌صدا کردن');
        muteButton.title = muted ? 'فعال کردن صدا' : 'بی‌صدا کردن';
      }
      if (volume && document.activeElement !== volume) volume.value = String(video.muted ? 0 : video.volume);
    }

    function setupPlayerControls() {
      const video = document.getElementById('animeVideo');
      if (!video || video.dataset.controlsReady === 'true') return;
      video.dataset.controlsReady = 'true';

      ['loadedmetadata', 'durationchange', 'timeupdate', 'play', 'pause', 'ended', 'volumechange', 'seeking', 'seeked', 'progress'].forEach(eventName => {
        video.addEventListener(eventName, syncPlayerControls);
      });
      video.addEventListener('click', togglePlayerPlayback);
      video.addEventListener('loadedmetadata', restorePlaybackPosition);
      video.addEventListener('timeupdate', savePlaybackPosition);
      video.addEventListener('ratechange', syncPlaybackRate);
      const seek = document.getElementById('playerSeek');
      if (seek) {
        seek.addEventListener('input', () => {
          if (Number.isFinite(video.duration)) {
            video.currentTime = Number(seek.value);
            syncPlayerControls();
          }
        });
      }
      const volume = document.getElementById('playerVolume');
      if (volume) {
        volume.addEventListener('input', () => {
          video.volume = Number(volume.value);
          video.muted = video.volume === 0;
          syncPlayerControls();
        });
      }
      syncPlayerControls();
    }

    function savePlaybackPosition() {
      const video = document.getElementById('animeVideo');
      if (!video || !activeEpisodeKey || !Number.isFinite(video.currentTime) || video.currentTime < 3) return;
      try { localStorage.setItem(activeEpisodeKey, JSON.stringify({ time: video.currentTime })); } catch (_) {}
    }

    function restorePlaybackPosition() {
      const video = document.getElementById('animeVideo');
      if (!video || !activeEpisodeKey || resumePromptShown || !Number.isFinite(video.duration) || video.duration <= 0) return;
      let saved;
      try { saved = JSON.parse(localStorage.getItem(activeEpisodeKey) || 'null'); } catch (_) { saved = null; }
      if (!saved || !Number.isFinite(saved.time) || saved.time < 10 || saved.time > video.duration - 15) return;
      resumePromptShown = true;
      if (window.confirm('ادامهٔ پخش از ' + formatPlayerTime(saved.time) + '؟')) video.currentTime = Math.min(saved.time, video.duration - 1);
    }

    function changePlaybackRate(rate) {
      const video = document.getElementById('animeVideo');
      if (video) video.playbackRate = Number(rate) || 1;
      syncPlaybackRate();
    }

    function syncPlaybackRate() {
      const video = document.getElementById('animeVideo');
      const select = document.getElementById('playerSpeed');
      if (video && select) select.value = String(video.playbackRate || 1);
    }

    function toggleSubtitles() {
      const video = document.getElementById('animeVideo');
      const button = document.getElementById('playerSubtitles');
      if (!video || !button) return;
      const tracks = Array.from(video.textTracks || []);
      if (!tracks.length) { button.title = 'برای این قسمت زیرنویس موجود نیست'; return; }
      const enabled = tracks.some(track => track.mode === 'showing');
      tracks.forEach(track => { track.mode = enabled ? 'disabled' : 'showing'; });
      button.setAttribute('aria-pressed', String(!enabled));
      button.classList.toggle('is-active', !enabled);
      button.title = enabled ? 'فعال کردن زیرنویس' : 'خاموش کردن زیرنویس';
    }

    document.addEventListener('keydown', event => {
      const player = document.getElementById('animePlayer');
      const video = document.getElementById('animeVideo');
      if (!player || player.hidden || !video || event.ctrlKey || event.altKey || event.metaKey) return;
      if (event.target && event.target.matches('input, textarea, select, button, [contenteditable="true"]')) return;
      switch (event.code) {
        case 'Space': event.preventDefault(); togglePlayerPlayback(); break;
        case 'ArrowLeft': event.preventDefault(); skipPlayer(-5); break;
        case 'ArrowRight': event.preventDefault(); skipPlayer(5); break;
        case 'KeyM': togglePlayerMute(); break;
        case 'KeyF': togglePlayerFullscreen(); break;
      }
    });

    function togglePlayerPlayback() {
      const video = document.getElementById('animeVideo');
      if (!video) return;
      if (video.paused || video.ended) video.play().catch(() => {});
      else video.pause();
      syncPlayerControls();
    }

    function skipPlayer(seconds) {
      const video = document.getElementById('animeVideo');
      if (!video || !Number.isFinite(video.duration)) return;
      video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + seconds));
      syncPlayerControls();
    }

    function togglePlayerMute() {
      const video = document.getElementById('animeVideo');
      if (!video) return;
      video.muted = !video.muted;
      if (!video.muted && video.volume === 0) video.volume = 0.7;
      syncPlayerControls();
    }

    function togglePlayerFullscreen() {
      const player = document.getElementById('animePlayer');
      const video = document.getElementById('animeVideo');
      const target = player && player.querySelector('.player-screen');
      if (!target) return;
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      } else if (target.requestFullscreen) {
        target.requestFullscreen().catch(() => {
          if (video && video.webkitEnterFullscreen) video.webkitEnterFullscreen();
        });
      } else if (video && video.webkitEnterFullscreen) {
        video.webkitEnterFullscreen();
      }
    }

    function closeAnimePlayer() {
      const player = document.getElementById('animePlayer');
      const video = document.getElementById('animeVideo');
      if (video) video.pause();
      destroyDashPlayer();
      if (player) player.hidden = true;
    }

    function actionsHtml(ep) {
      const watch = ep.watch ? mediaUrl(ep.watch) : '';
      const watchAction = watch
        ? (isDirectVideo(watch)
          ? `<button type="button" class="chapter-btn read" onclick="playEpisode(this)" data-src="${escapeHtml(watch)}" data-subtitle="${escapeHtml(mediaUrl(ep.subtitle || ''))}" data-label="قسمت ${escapeHtml(ep.number)} · ${escapeHtml(ep.quality || '')}">تماشای آنلاین</button>`
          : `<a href="${escapeHtml(watch)}" target="_blank" rel="noopener" class="chapter-btn read">تماشا در میزبان</a>`)
        : '';
      return `
        ${watchAction}
        ${ep.download ? `<a href="${escapeHtml(mediaUrl(ep.download))}" target="_blank" rel="noopener" class="chapter-btn download">دانلود</a>` : ''}
      `;
    }

    function playEpisode(button) {
      const player = document.getElementById('animePlayer');
      const video = document.getElementById('animeVideo');
      const source = button.dataset.src;
      activeEpisodeKey = 'ryukmanga-progress:' + source;
      resumePromptShown = false;
      const subtitle = button.dataset.subtitle;
      const label = button.dataset.label || 'پخش انیمه';

      if (!player || !video || !source) return;

      destroyDashPlayer();
      video.pause();
      video.removeAttribute('src');
      video.querySelectorAll('source, track').forEach(node => node.remove());
      video.load();

      if (subtitle && /\\.vtt(?:$|[?#])/i.test(subtitle)) {
        const track = document.createElement('track');
        track.kind = 'subtitles';
        track.label = 'زیرنویس فارسی';
        track.srclang = 'fa';
        track.src = subtitle;
        track.default = true;
        video.appendChild(track);
      }

      document.getElementById('animePlayerTitle').textContent = label;
      player.hidden = false;
      player.scrollIntoView({ behavior: 'smooth', block: 'start' });

      const isDashSource = /\\.mpd(?:$|[?#])/i.test(source) || /\\/dash\\//i.test(source);
      if (isDashSource && window.dashjs && typeof window.dashjs.MediaPlayer === 'function') {
        dashPlayer = window.dashjs.MediaPlayer().create();
        dashPlayer.on(window.dashjs.MediaPlayer.events.ERROR, () => {
          // Some Namasha URLs may be standalone media endpoints rather than DASH manifests.
          // Try native playback only if dash.js could not attach usable media.
          if (video.error || video.readyState === 0) {
            destroyDashPlayer();
            video.removeAttribute('src');
            video.src = source;
            video.load();
            video.play().catch(() => {});
          }
        });
        // dash.js owns the MediaSource lifecycle; do not call video.load() afterward,
        // because it can reset the MediaSource that dash.js just attached.
        dashPlayer.initialize(video, source, true);
      } else {
        video.src = source;
        video.load();
        video.play().catch(() => {});
      }

      syncPlayerControls();
    }

    function renderPage(anime) {
      const genresHtml = (anime.genres || []).map(g => `<span class="genre-tag">${escapeHtml(g)}</span>`).join('');

      const total = anime.episodes_count || anime.episodes.length || 0;
      const available = new Set(anime.episodes.map(e => e.number)).size;
      const countText = `${total} قسمت` + (available && available !== total ? ` · ${available} قسمت در دسترس` : '');

      const metaParts = [];
      if (anime.studio) metaParts.push(`استودیو: ${escapeHtml(anime.studio)}`);
      if (anime.year) metaParts.push(`سال انتشار: ${escapeHtml(anime.year)}`);
      if (anime.status) metaParts.push(`وضعیت: ${escapeHtml(anime.status)}`);

      const episodesHtml = anime.episodes.length
        ? anime.episodes.map(ep => `
            <div class="chapter-row">
              <div class="chapter-info">
                <h4>قسمت ${escapeHtml(ep.number)}
                  ${ep.quality ? `<span class="episode-tag">${escapeHtml(ep.quality)}</span>` : ''}
                  ${ep.audio ? `<span class="episode-tag">${escapeHtml(ep.audio)}</span>` : ''}
                </h4>
              </div>
              <div class="chapter-actions">${actionsHtml(ep)}</div>
            </div>
          `).join('')
        : `<p class="empty-state">هنوز قسمتی برای این انیمه اضافه نشده.</p>`;

      pageContent.innerHTML = `
        <section class="manga-header">
          <div class="manga-header-cover">
            ${anime.poster ? `<img src="${escapeHtml(mediaUrl(anime.poster))}" alt="${escapeHtml(anime.title)}">` : '📺'}
          </div>
          <div class="manga-header-info">
            <h1>${escapeHtml(anime.title)}</h1>
            ${anime.title_fa ? `<h2>${escapeHtml(anime.title_fa)}</h2>` : ''}
            <div class="genre-tags">${genresHtml}</div>
            <p class="chapter-count">${countText}</p>
            ${metaParts.length ? `<p class="manga-meta">${metaParts.join(' · ')}</p>` : ''}
            ${anime.description ? `<p class="manga-description">${escapeHtml(anime.description)}</p>` : ''}
          </div>
        </section>

        <section id="animePlayer" class="anime-player" hidden aria-label="پخش‌کننده انیمه">
          <div class="anime-player-heading">
            <h3 id="animePlayerTitle">پخش انیمه</h3>
            <button type="button" class="player-close" onclick="closeAnimePlayer()">بستن پخش‌کننده ✕</button>
          </div>
          <div class="player-screen">
            <video id="animeVideo" playsinline preload="metadata">
              مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.
            </video>
            <div class="player-controls" aria-label="کنترل‌های پخش ویدیو">
              <div class="player-seek-row">
                <span id="playerCurrent" class="player-time">00:00</span>
                <input id="playerSeek" class="player-seek" type="range" min="0" max="0" value="0" step="0.1" aria-label="موقعیت ویدیو" disabled>
                <span id="playerDuration" class="player-time">00:00</span>
              </div>
              <div class="player-toolbar">
                <div class="player-control-group">
                  <button id="playerPlay" class="player-control play-control" type="button" onclick="togglePlayerPlayback()" aria-label="پخش" title="پخش"><span id="playerPlayIcon">▶</span><span id="playerPlayLabel">پخش</span></button>
                  <button class="player-control skip-control" type="button" onclick="skipPlayer(-10)" aria-label="۱۰ ثانیه عقب" title="۱۰ ثانیه عقب">↶<small>۱۰</small></button>
                  <button class="player-control skip-control" type="button" onclick="skipPlayer(10)" aria-label="۱۰ ثانیه جلو" title="۱۰ ثانیه جلو">↷<small>۱۰</small></button>
                </div>
                <div class="player-control-group player-audio-group">
                  <button id="playerMute" class="player-control icon-control" type="button" onclick="togglePlayerMute()" aria-label="بی‌صدا کردن" title="بی‌صدا کردن">🔊</button>
                  <label class="player-speed-wrap" title="سرعت پخش"><span>سرعت</span><select id="playerSpeed" class="player-speed" aria-label="سرعت پخش" onchange="changePlaybackRate(this.value)"><option value="0.75">۰٫۷۵×</option><option value="1" selected>۱×</option><option value="1.25">۱٫۲۵×</option><option value="1.5">۱٫۵×</option><option value="1.75">۱٫۷۵×</option><option value="2">۲×</option></select></label>
                  <button id="playerSubtitles" class="player-control icon-control subtitle-control" type="button" onclick="toggleSubtitles()" aria-label="روشن یا خاموش کردن زیرنویس" title="روشن یا خاموش کردن زیرنویس" aria-pressed="false">CC</button>
                  <input id="playerVolume" class="player-volume" type="range" min="0" max="1" value="1" step="0.05" aria-label="میزان صدا">
                  <button class="player-control icon-control fullscreen-control" type="button" onclick="togglePlayerFullscreen()" aria-label="تمام‌صفحه" title="تمام‌صفحه">⛶</button>
                </div>
              </div>
            </div>
          </div>
          <p class="player-note">پخش فایل‌های MP4 و WebM و لینک‌های HLS/DASH پشتیبانی می‌شود؛ زیرنویس جداگانه باید با فرمت WebVTT (فایل VTT) باشد.</p>
        </section>

        <section class="chapters-section">
          <h3>قسمت‌ها</h3>
          <div class="chapters-list">${episodesHtml}</div>
        </section>
      `;
      setupPlayerControls();
    }

    init();
  </script>

  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
