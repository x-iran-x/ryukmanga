<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موسیقی و اوست‌ها | RyukManga</title>

  <!-- فونت وزیرمتن گوگل -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">

  <!-- استایل اصلی از ریشه سایت -->
  <link rel="stylesheet" href="../style.css">

    <style>
    /* استایل‌های اختصاصی بخش موسیقی (چیدمان تک‌ستونه و شیک) */
    .music-grid {
      display: grid;
      grid-template-columns: 1fr; /* تک‌ستونه شدن کارت‌ها */
      gap: 20px;
      margin-top: 25px;
      max-width: 800px; /* جلوگیری از کش اومدن بیش از حد در مانیتور */
      margin-left: auto;
      margin-right: auto;
    }

    .track-card {
      background: #16181f;
      border: 1px solid #282b36;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .track-card:hover {
      transform: translateY(-4px);
      border-color: #ff334b;
    }

    .track-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .track-badge {
      width: 45px;
      height: 45px;
      background: #0f1015;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      border: 1px solid #333;
    }

    .track-details h4 {
      margin: 0;
      color: #fff;
      font-size: 1rem;
    }

    .track-details span {
      font-size: 0.8rem;
      color: #8f94a6;
    }

    .audio-player {
      width: 100%;
      height: 36px;
      border-radius: 6px;
      outline: none;
    }
  </style>
</head>
<body>

  <div id="main-content">
    <!-- نوار ناوبری -->
    <header class="navbar">
      <div class="logo"><a href="../" style="text-decoration: none; color: inherit;">RYUK<span>MANGA</span></a></div>
      
      <nav class="nav-links">
        <a href="../">خانه</a>
        <a href="../manga/">مانگاها</a>
        <a href="../anime/">انیمه‌ها</a>
        <a href="../top/">برترین‌ها</a>
        <a href="../forums/">تالارها</a>
        <a href="./" class="active">موسیقی</a>
      </nav>

      <div class="nav-actions">
        <input type="text" placeholder="جستجوی ساندترک..." class="search-input">
      </div>
    </header>

    <main class="content-container">
      <section class="banner">
        <h2>🎵 تالار موسیقی و OSTهای ماندگار</h2>
        <p>مجموعه ناب‌ترین و اتمسفریک‌ترین موسیقی‌های متن انیمه‌ها و مانگاها با پخش آنلاین.</p>
      </section>

      <!-- گرید ترک‌های موسیقی -->
      <section class="music-grid">
        
        <!-- ترک اول -->
        <div class="track-card">
          <div class="track-info">
            <div class="track-badge">🍎</div>
            <div class="track-details">
              <h4>L's Theme</h4>
              <span>Death Note OST</span>
            </div>
          </div>
          <audio class="audio-player" controls>
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
            مرورگر شما از پخش‌کننده صوتی پشتیبانی نمی‌کند.
          </audio>
        </div>

        <!-- ترک دوم -->
        <div class="track-card">
          <div class="track-info">
            <div class="track-badge">⚔️</div>
            <div class="track-details">
              <h4>Guts' Theme</h4>
              <span>Berserk OST</span>
            </div>
          </div>
          <audio class="audio-player" controls>
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg">
            مرورگر شما از پخش‌کننده صوتی پشتیبانی نمی‌کند.
          </audio>
        </div>

        <!-- ترک سوم -->
        <div class="track-card">
          <div class="track-info">
            <div class="track-badge">🩸</div>
            <div class="track-details">
              <h4>Kick Back (Chainsaw)</h4>
              <span>Chainsaw Man Opening</span>
            </div>
          </div>
          <audio class="audio-player" controls>
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" type="audio/mpeg">
            مرورگر شما از پخش‌کننده صوتی پشتیبانی نمی‌کند.
          </audio>
        </div>

      </section>
    </main>
  </div>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
