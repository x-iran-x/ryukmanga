<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موسیقی و اوست‌ها | RyukManga</title>

  <!-- فونت وزیرمتن گوگل -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">

  <!-- استایل اصلی از ریشه سایت -->
  <link rel="stylesheet" href="../../style.css">
  <!-- استایل اختصاصی صفحه موسیقی -->
  <link rel="stylesheet" href="music.css">
</head>
<body>

  <div id="main-content">
    <!-- نوار ناوبری -->
    <header class="navbar">
      <div class="logo"><a href="../../" style="text-decoration: none; color: inherit;">RYUK<span>MANGA</span></a></div>

      <nav class="nav-links">
        <a href="../../">خانه</a>
        <a href="../../manga/">مانگاها</a>
        <a href="../../anime/">انیمه‌ها</a>
        <a href="../../top/">برترین‌ها</a>
        <a href="../../forums/">تالارها</a>
        <a href="../" class="active">موسیقی</a>
      </nav>

      <div class="nav-actions">
        <input type="text" placeholder="جستجوی ساندترک..." class="search-input">
      </div>
    </header>

    <main class="content-container">
      <section class="banner">
        <h2>🎵 تالار موسیقی و OSTهای ماندگار</h2>
        <p>مجموعه ناب‌ترین و اتمسفریک‌ترین موسیقی‌های متن انیمه‌ها و مانگاها با پخش آنلاین.</p>
      </section>

      <a href="../" class="back-link">→ بازگشت به بخش موسیقی</a>

      <!-- نوار فیلتر نوع (با جاوااسکریپت پر می‌شود) -->
      <div class="filter-track" id="filterBar"></div>

      <!-- گرید ترک‌های موسیقی (با جاوااسکریپت پر می‌شود) -->
      <section class="music-grid" id="musicGrid"></section>
    </main>
  </div>

  <script src="../../media-config.js"></script>

  <!-- منطق رندر و فیلتر -->
  <script>
    const musicGrid = document.getElementById('musicGrid');
    const filterBar = document.getElementById('filterBar');
    const searchInput = document.querySelector('.search-input');

    let LIST = [];
    let activeType = 'همه';
    let searchText = '';

    async function init() {
      try {
        LIST = await loadMusic();
      } catch (err) {
        musicGrid.innerHTML = `<div class="empty-state">خطا در بارگذاری موسیقی‌ها (${escapeHtml(err.message)})</div>`;
        return;
      }
      renderFilters();
      renderCards();
    }

    function getAllTypes(list) {
      const types = new Set(list.map(item => item.type).filter(Boolean));
      return ['همه', ...types];
    }

    function renderFilters() {
      const types = getAllTypes(LIST);

      filterBar.innerHTML = `<div class="filter-indicator" id="filterIndicator"></div>` +
        types.map(type => `
          <button
            type="button"
            class="filter-btn ${type === activeType ? 'active' : ''}"
            data-type="${escapeHtml(type)}"
          >
            ${escapeHtml(type)}
          </button>
        `).join('');

      filterBar.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeType = btn.dataset.type;
          renderFilters();
          renderCards();
        });
      });

      requestAnimationFrame(updateIndicator);
    }

    function updateIndicator() {
      const activeBtn = filterBar.querySelector('.filter-btn.active');
      const indicator = document.getElementById('filterIndicator');
      if (activeBtn && indicator) {
        indicator.style.width = activeBtn.offsetWidth + 'px';
        indicator.style.left = activeBtn.offsetLeft + 'px';
      }
    }

    window.addEventListener('resize', updateIndicator);

    if (searchInput) {
      searchInput.addEventListener('input', () => {
        searchText = searchInput.value.trim().toLowerCase();
        renderCards();
      });
    }

    function getFiltered() {
      return LIST.filter(item => {
        const typeOk = activeType === 'همه' || item.type === activeType;
        const textOk = !searchText ||
          String(item.title || '').toLowerCase().includes(searchText) ||
          String(item.source || '').toLowerCase().includes(searchText) ||
          String(item.artist || '').toLowerCase().includes(searchText);
        return typeOk && textOk;
      });
    }

    function renderCards() {
      if (LIST.length === 0) {
        musicGrid.innerHTML = `<div class="empty-state">هنوز موسیقی‌ای اضافه نشده.</div>`;
        return;
      }

      const filtered = getFiltered();
      if (filtered.length === 0) {
        musicGrid.innerHTML = `<div class="empty-state">موردی پیدا نشد.</div>`;
        return;
      }

      musicGrid.innerHTML = filtered.map(item => `
        <div class="track-card">
          <div class="track-info">
            <div class="track-badge">${item.art
              ? `<img src="${escapeHtml(item.art)}" alt="" loading="lazy">`
              : escapeHtml(item.icon || '🎧')}</div>
            <div class="track-details">
              <h4>${escapeHtml(item.title)}</h4>
              <span>${escapeHtml(item.source || '')}${item.artist ? ' · ' + escapeHtml(item.artist) : ''}</span>
            </div>
          </div>
          ${item.audio
            ? `<audio class="audio-player" controls preload="none" src="${escapeHtml(item.audio)}">
                 مرورگر شما از پخش‌کننده صوتی پشتیبانی نمی‌کند.
               </audio>`
            : `<p class="track-missing">فایل صوتی هنوز اضافه نشده.</p>`}
        </div>
      `).join('');
    }

    init();
  </script>

  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
