    <line x1="0" y1="510" x2="600" y2="550"/><line x1="0" y1="450" x2="600" y2="510"/>
  </g>
  <circle cx="300" cy="312" r="290" fill="url(#glow)"/>

  <g transform="translate(300,312)">
    <g fill="#050507" stroke="#e11d2e" stroke-width="4" stroke-linejoin="miter">
      <path d="M-100,-30 L-250,-175 L-215,-95 L-270,-110 L-225,-35 L-265,-25 L-215,25 L-245,95 L-135,45 L-100,45 Z"/>
      <path d="M-100,-30 L-215,-95 M-100,-10 L-225,-35 M-100,10 L-215,25 M-100,30 L-245,95" stroke="#e11d2e" stroke-width="2" fill="none" opacity="0.7"/>
    </g>
    <g transform="scale(-1,1)" fill="#050507" stroke="#e11d2e" stroke-width="4" stroke-linejoin="miter">
      <path d="M-100,-30 L-250,-175 L-215,-95 L-270,-110 L-225,-35 L-265,-25 L-215,25 L-245,95 L-135,45 L-100,45 Z"/>
      <path d="M-100,-30 L-215,-95 M-100,-10 L-225,-35 M-100,10 L-215,25 M-100,30 L-245,95" stroke="#e11d2e" stroke-width="2" fill="none" opacity="0.7"/>
    </g>

    <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75" fill="#e11d2e" opacity="0.35" filter="url(#soft)"/>
    <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75" fill="#101015" stroke="url(#red)" stroke-width="9" stroke-linejoin="miter"/>
    <g clip-path="url(#hexClip)">
      <rect x="-130" y="-150" width="260" height="300" fill="url(#dotsRed)"/>
      <circle cx="0" cy="0" r="92" fill="#101015"/>
      <polygon points="-130,60 130,-60 130,-20 -130,100" fill="#e11d2e" opacity="0.18"/>
    </g>
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" fill="none" stroke="#3a3a46" stroke-width="2.5"/>
    <circle r="92" fill="none" stroke="#f5f5f7" stroke-width="2" stroke-dasharray="3 7" opacity="0.7"/>

    <path d="M40,-92 A46,46 0 1 0 40,-48 A36,36 0 1 1 40,-92 Z" fill="#f5f5f7" opacity="0.9" transform="translate(-6,-4) scale(0.5)"/>
    <g fill="#ffffff">
      <polygon points="-96,-48 -92,-58 -88,-48 -78,-44 -88,-40 -92,-30 -96,-40 -106,-44"/>
      <polygon points="98,38 101,31 104,38 111,41 104,44 101,51 98,44 91,41"/>
    </g>

    <g transform="translate(0,6) scale(1.12) translate(-163,-162)">
      <path d="M109 94 H179 Q219 94 219 136 Q219 169 187 179 L226 239 H186 L152 182 H144 V239 H109 Z M144 122 V156 H176 Q186 156 186 139 Q186 122 176 122 Z" fill="#e11d2e" fill-rule="evenodd" transform="translate(5,5)"/>
      <path d="M105 90 H175 Q215 90 215 132 Q215 165 183 175 L222 235 H182 L148 178 H140 V235 H105 Z M140 118 V152 H172 Q182 152 182 135 Q182 118 172 118 Z" fill="url(#metal)" stroke="#0a0a0d" stroke-width="2.5" fill-rule="evenodd"/>
    </g>
    <polygon points="-125,70 135,-92 142,-80 -118,82" fill="#e11d2e"/>
    <polygon points="-125,70 135,-92 138,-87 -122,75" fill="#ffffff" opacity="0.8"/>
  </g>

  <g stroke="#e11d2e" stroke-width="5" fill="none">
    <path d="M24,66 V24 H66"/><path d="M534,24 H576 V66"/>
    <path d="M24,534 V576 H66"/><path d="M576,534 V576 H534"/>
