<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 168" width="1680" height="336">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a0b10"/>
      <stop offset="0.5" stop-color="#0a0a0d"/>
      <stop offset="1" stop-color="#1a0b10"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4252"/>
      <stop offset="1" stop-color="#a30f1d"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9b9c4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e11d2e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e11d2e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <circle cx="5" cy="5" r="2" fill="#ffffff" opacity="0.10"/>
    </pattern>
    <pattern id="dotsRed" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="4.5" cy="4.5" r="2.2" fill="#e11d2e" opacity="0.55"/>
    </pattern>
    <clipPath id="hexClip">
      <polygon points="0,-138 120,-69 120,69 0,138 -120,69 -120,-69"/>
    </clipPath>
  </defs>
<g transform="scale(0.84)">

  <rect width="1000" height="200" fill="url(#bg)"/>
  <rect width="1000" height="200" fill="url(#dots)"/>
  <rect x="0" y="0" width="1000" height="5" fill="#e11d2e"/>
  <rect x="0" y="195" width="1000" height="5" fill="#e11d2e"/>
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="2">
    <line x1="0" y1="40" x2="1000" y2="25"/><line x1="0" y1="170" x2="1000" y2="185"/>
  </g>
  <circle cx="154" cy="102" r="120" fill="url(#glow)"/>

  <!-- mini emblem -->
  <g transform="translate(154,104) scale(0.52)">
    <g fill="#050507" stroke="#e11d2e" stroke-width="6" stroke-linejoin="miter">
      <path d="M-100,-30 L-250,-175 L-215,-95 L-270,-110 L-225,-35 L-265,-25 L-215,25 L-245,95 L-135,45 L-100,45 Z"/>
    </g>
    <g transform="scale(-1,1)" fill="#050507" stroke="#e11d2e" stroke-width="6" stroke-linejoin="miter">
      <path d="M-100,-30 L-250,-175 L-215,-95 L-270,-110 L-225,-35 L-265,-25 L-215,25 L-245,95 L-135,45 L-100,45 Z"/>
    </g>
    <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75" fill="#101015" stroke="url(#red)" stroke-width="12" stroke-linejoin="miter"/>
    <g clip-path="url(#hexClip)">
      <rect x="-130" y="-150" width="260" height="300" fill="url(#dotsRed)"/>
      <circle cx="0" cy="0" r="92" fill="#101015"/>
    </g>
    <circle r="92" fill="none" stroke="#f5f5f7" stroke-width="3" stroke-dasharray="3 7" opacity="0.7"/>
    <g transform="translate(0,6) scale(1.12) translate(-163,-162)">
      <path d="M109 94 H179 Q219 94 219 136 Q219 169 187 179 L226 239 H186 L152 182 H144 V239 H109 Z M144 122 V156 H176 Q186 156 186 139 Q186 122 176 122 Z" fill="#e11d2e" fill-rule="evenodd" transform="translate(5,5)"/>
      <path d="M105 90 H175 Q215 90 215 132 Q215 165 183 175 L222 235 H182 L148 178 H140 V235 H105 Z M140 118 V152 H172 Q182 152 182 135 Q182 118 172 118 Z" fill="url(#metal)" stroke="#0a0a0d" stroke-width="3" fill-rule="evenodd"/>
    </g>
    <polygon points="-125,70 135,-92 142,-80 -118,82" fill="#e11d2e"/>
  </g>

  <!-- wordmark -->
  <g font-family="Impact, 'Arial Black', Arial, sans-serif" font-weight="900">
    <text x="306" y="128" font-size="104" fill="#e11d2e" letter-spacing="5">RYUK</text>
    <text x="300" y="122" font-size="104" fill="url(#metal)" stroke="#0a0a0d" stroke-width="2.5" letter-spacing="5">RYUK</text>
  </g>
  <g fill="#e11d2e">
    <rect x="302" y="134" width="300" height="5"/>
    <path d="M330,139 h7 v18 q-3.5,7 -7,0 Z"/>
    <path d="M440,139 h5 v10 q-2.5,6 -5,0 Z"/>
    <path d="M540,139 h7 v22 q-3.5,8 -7,0 Z"/>
    <circle cx="362" cy="152" r="3"/>
  </g>

  <!-- MANGA banner -->
  <polygon points="640,62 962,62 942,140 620,140" fill="#050507" stroke="#e11d2e" stroke-width="3.5"/>
  <polygon points="640,62 962,62 959,73 637,73" fill="#e11d2e" opacity="0.25"/>
  <text x="652" y="116" font-family="'Arial Black', Impact, Arial, sans-serif" font-size="44" font-weight="900" fill="#f5f5f7" letter-spacing="15">MANGA</text>
  <text x="940" y="168" font-family="'Yu Gothic','MS Gothic',sans-serif" font-size="18" font-weight="700" fill="#e11d2e" text-anchor="end" letter-spacing="8">漫画</text>
</g>
</svg>
