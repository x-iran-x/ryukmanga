<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>صفحه پیدا نشد | RyukManga</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; height: 100vh; background: #0f1015; flex-direction: column; text-align: center; }
    .status-container { max-width: 500px; padding: 20px; }
    .status-img { width: 100%; max-width: 300px; margin-bottom: 20px; }
    h1 { color: #fff; }
    .back-btn { display: inline-block; margin-top: 20px; padding: 10px 25px; background: #ff334b; color: white; text-decoration: none; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="status-container">
    <!-- عکس خطای خودت رو اینجا بزار -->
    <img src="eror.jpg" alt="خطا" class="status-img">
    <h1>اوخ! اینجا خبری نیست...</h1>
    <p style="color: #8f94a6;">این صفحه وجود نداره یا جابجا شده.</p>
    <a href="/" class="back-btn">برگشت به خانه</a>
  </div>
</body>
</html>
