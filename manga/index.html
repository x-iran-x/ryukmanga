<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مانگاها | RyukManga</title>

  <!-- فونت وزیرمتن -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">

  <!-- استایل اصلی سایت -->
  <link rel="stylesheet" href="../style.css">
  <!-- استایل اختصاصی صفحه مانگاها -->
  <link rel="stylesheet" href="manga.css">
</head>
<body>

  <div id="main-content">
    <!-- نوار ناوبری -->
    <header class="navbar">
      <div class="logo"><a href="../" style="text-decoration: none; color: inherit;">RYUK<span>MANGA</span></a></div>

      <nav class="nav-links">
        <a href="../">خانه</a>
        <a href="./" class="active">مانگاها</a>
        <a href="../anime/">انیمه‌ها</a>
        <a href="../top/">برترین‌ها</a>
        <a href="../forums/">تالارها</a>
        <a href="../music/">موسیقی</a>
      </nav>

      <div class="nav-actions">
        <input type="text" placeholder="جستجوی مانگا..." class="search-input">
      </div>
    </header>

    <main class="content-container">
      <section class="banner">
        <h2>📚 آرشیو مانگاها</h2>
        <p>مجموعه کامل مانگاها با ترجمه اختصاصی و بالاترین کیفیت.</p>
      </section>

      <!-- نوار فیلتر ژانر (با جاوااسکریپت پر می‌شود) -->
      <div class="filter-track" id="filterBar"></div>

      <!-- گرید مانگاها (با جاوااسکریپت پر می‌شود) -->
      <section class="manga-grid" id="mangaGrid"></section>
    </main>
  </div>

  <!-- کتابخانه Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- منطق رندر و فیلتر -->
  <script>
    const SUPABASE_URL = 'https://fzmrodjukzixfwuitxvr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6bXJvZGp1a3ppeGZ3dWl0eHZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNzc0NjIsImV4cCI6MjEwNDk1MzQ2Mn0.SAK-a5yecdJLYZTUApk32PdFrSpo0p_8Pv1aVzNBA9Y';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const mangaGrid = document.getElementById('mangaGrid');
    const filterBar = document.getElementById('filterBar');

    let mangaList = [];
    let activeGenre = 'همه';

    async function loadMangaFromDatabase() {
      const { data, error } = await supabaseClient
        .from('manga')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        mangaGrid.innerHTML = `<div class="empty-state">خطا در بارگذاری: ${error.message}</div>`;
        return;
      }

      mangaList = data || [];
      renderFilters();
      renderCards();
    }

    function getAllGenres(list) {
      const genres = new Set();
      list.forEach(item => (item.genres || []).forEach(g => genres.add(g)));
      return ['همه', ...genres];
    }

    function renderFilters() {
      const genres = getAllGenres(mangaList);

      filterBar.innerHTML = `<div class="filter-indicator" id="filterIndicator"></div>` +
        genres.map(genre => `
          <button
            type="button"
            class="filter-btn ${genre === activeGenre ? 'active' : ''}"
            data-genre="${genre}"
          >
            ${genre}
          </button>
        `).join('');

      filterBar.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeGenre = btn.dataset.genre;
          renderFilters();
          renderCards();
        });
      });

      requestAnimationFrame(updateIndicator);
    }

    function updateIndicator() {
      const activeBtn = filterBar.querySelector('.filter-btn.active');
      const indicator = document.getElementById('filterIndicator');
      if (activeBtn && indicator) {
        indicator.style.width = activeBtn.offsetWidth + 'px';
        indicator.style.left = activeBtn.offsetLeft + 'px';
      }
    }

    window.addEventListener('resize', updateIndicator);

    function renderCards() {
      const filtered = activeGenre === 'همه'
        ? mangaList
        : mangaList.filter(item => (item.genres || []).includes(activeGenre));

      if (filtered.length === 0) {
        mangaGrid.innerHTML = `<div class="empty-state">موردی با این ژانر پیدا نشد.</div>`;
        return;
      }

      mangaGrid.innerHTML = filtered.map(item => `
        <a href="view.html?id=${item.id}" class="manga-card">
          <div class="manga-poster">
            ${item.cover_url ? `<img src="${item.cover_url}" alt="${item.title}">` : '📓'}
          </div>
          <div class="manga-info">
            <h3>${item.title}</h3>
            <h4>${item.title_fa || ''}</h4>
            <p>تعداد چپتر: ${item.chapters || 0}</p>
          </div>
        </a>
      `).join('');
    }

    loadMangaFromDatabase();
  </script>

  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
