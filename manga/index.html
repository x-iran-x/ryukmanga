<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مانگاها | RyukManga</title>

  <!-- فونت وزیرمتن -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">

  <!-- استایل اصلی سایت -->
  <link rel="stylesheet" href="../style.css">
  <!-- استایل اختصاصی صفحه مانگاها -->
  <link rel="stylesheet" href="manga.css">
</head>
<body>

  <div id="main-content">
    <!-- نوار ناوبری -->
    <header class="navbar">
      <div class="logo"><a href="../" style="text-decoration: none; color: inherit;">RYUK<span>MANGA</span></a></div>

      <nav class="nav-links">
        <a href="../">خانه</a>
        <a href="./" class="active">مانگاها</a>
        <a href="../anime/">انیمه‌ها</a>
        <a href="../top/">برترین‌ها</a>
        <a href="../forums/">تالارها</a>
        <a href="../music/">موسیقی</a>
      </nav>

      <div class="nav-actions">
        <input type="text" placeholder="جستجوی مانگا..." class="search-input">
      </div>
    </header>

    <main class="content-container">
      <section class="banner">
        <h2>📚 آرشیو مانگاها</h2>
        <p>مجموعه کامل مانگاها با ترجمه اختصاصی و بالاترین کیفیت.</p>
      </section>

      <!-- نوار فیلتر ژانر (با جاوااسکریپت پر می‌شود) -->
      <div class="filter-track" id="filterBar"></div>

      <!-- گرید مانگاها (با جاوااسکریپت پر می‌شود) -->
      <section class="manga-grid" id="mangaGrid"></section>
    </main>
  </div>

  <script src="../media-config.js"></script>

  <!-- منطق رندر و فیلتر -->
  <script>
    const mangaGrid = document.getElementById('mangaGrid');
    const filterBar = document.getElementById('filterBar');
    const searchInput = document.querySelector('.search-input');

    let mangaList = [];
    let activeGenre = 'همه';
    let searchText = '';

    async function init() {
      try {
        mangaList = await loadCatalog();
      } catch (err) {
        mangaGrid.innerHTML = `<div class="empty-state">خطا در بارگذاری لیست مانگاها (${escapeHtml(err.message)})</div>`;
        return;
      }
      renderFilters();
      renderCards();
    }

    function getAllGenres(list) {
      const genres = new Set();
      list.forEach(item => (item.genres || []).forEach(g => genres.add(g)));
      return ['همه', ...genres];
    }

    function renderFilters() {
      const genres = getAllGenres(mangaList);

      filterBar.innerHTML = `<div class="filter-indicator" id="filterIndicator"></div>` +
        genres.map(genre => `
          <button
            type="button"
            class="filter-btn ${genre === activeGenre ? 'active' : ''}"
            data-genre="${escapeHtml(genre)}"
          >
            ${escapeHtml(genre)}
          </button>
        `).join('');

      filterBar.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeGenre = btn.dataset.genre;
          renderFilters();
          renderCards();
        });
      });

      requestAnimationFrame(updateIndicator);
    }

    function updateIndicator() {
      const activeBtn = filterBar.querySelector('.filter-btn.active');
      const indicator = document.getElementById('filterIndicator');
      if (activeBtn && indicator) {
        indicator.style.width = activeBtn.offsetWidth + 'px';
        indicator.style.left = activeBtn.offsetLeft + 'px';
      }
    }

    window.addEventListener('resize', updateIndicator);

    searchInput.addEventListener('input', () => {
      searchText = searchInput.value.trim().toLowerCase();
      renderCards();
    });

    function renderCards() {
      const filtered = mangaList.filter(item => {
        const genreOk = activeGenre === 'همه' || (item.genres || []).includes(activeGenre);
        const textOk = !searchText ||
          String(item.title || '').toLowerCase().includes(searchText) ||
          String(item.title_fa || '').toLowerCase().includes(searchText);
        return genreOk && textOk;
      });

      if (mangaList.length === 0) {
        mangaGrid.innerHTML = `<div class="empty-state">هنوز مانگایی اضافه نشده.</div>`;
        return;
      }

      if (filtered.length === 0) {
        mangaGrid.innerHTML = `<div class="empty-state">موردی پیدا نشد.</div>`;
        return;
      }

      mangaGrid.innerHTML = filtered.map(item => `
        <a href="view.html?id=${encodeURIComponent(item.slug)}" class="manga-card">
          <div class="manga-poster">
            ${item.cover ? `<img src="${escapeHtml(mediaUrl(item.cover))}" alt="${escapeHtml(item.title)}" loading="lazy">` : '📓'}
          </div>
          <div class="manga-info">
            <h3>${escapeHtml(item.title)}</h3>
            <h4>${escapeHtml(item.title_fa || '')}</h4>
            <p>تعداد جلدها: ${escapeHtml(item.volumes_count || item.volumes.length || 0)}</p>
          </div>
        </a>
      `).join('');
    }

    init();
  </script>

  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
