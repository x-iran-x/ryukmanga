<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مانگا | RyukManga</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="view.css">
</head>
<body>

  <div id="main-content">
    <header class="navbar">
      <div class="logo"><a href="../" style="text-decoration: none; color: inherit;">RYUK<span>MANGA</span></a></div>

      <nav class="nav-links">
        <a href="../">خانه</a>
        <a href="./" class="active">مانگاها</a>
        <a href="../anime/">انیمه‌ها</a>
        <a href="../top/">برترین‌ها</a>
        <a href="../forums/">تالارها</a>
        <a href="../music/">موسیقی</a>
      </nav>
    </header>

    <main class="content-container" id="pageContent">
      <p class="loading-state">در حال بارگذاری...</p>
    </main>
  </div>

  <script src="../media-config.js"></script>
  <script>
    const pageContent = document.getElementById('pageContent');

    // خواندن شناسه مانگا از آدرس صفحه (مثلاً view.html?id=chainsaw-man)
    const mangaId = new URLSearchParams(window.location.search).get('id');

    async function init() {
      if (!mangaId) {
        pageContent.innerHTML = `<p class="loading-state">شناسه مانگا مشخص نیست.</p>`;
        return;
      }

      let list;
      try {
        list = await loadCatalog();
      } catch (err) {
        pageContent.innerHTML = `<p class="loading-state">خطا در بارگذاری (${escapeHtml(err.message)})</p>`;
        return;
      }

      const manga = list.find(m => m.slug === mangaId);
      if (!manga) {
        pageContent.innerHTML = `<p class="loading-state">این مانگا پیدا نشد.</p>`;
        return;
      }

      document.title = manga.title + ' | RyukManga';
      renderPage(manga);
    }

    function actionsHtml(v) {
      return `
        ${v.read ? `<a href="${escapeHtml(mediaUrl(v.read))}" target="_blank" rel="noopener" class="chapter-btn read">مطالعه آنلاین</a>` : ''}
        ${v.download ? `<a href="${escapeHtml(mediaUrl(v.download))}" target="_blank" rel="noopener" class="chapter-btn download">دانلود</a>` : ''}
      `;
    }

    function renderPage(manga) {
      const genresHtml = (manga.genres || []).map(g => `<span class="genre-tag">${escapeHtml(g)}</span>`).join('');

      const total = manga.volumes_count || manga.volumes.length || 0;
      const available = manga.volumes.length;
      const countText = `${total} جلد` + (available && available !== total ? ` · ${available} جلد در دسترس` : '');

      const metaParts = [];
      if (manga.author) metaParts.push(`نویسنده: ${escapeHtml(manga.author)}`);
      if (manga.status) metaParts.push(`وضعیت: ${escapeHtml(manga.status)}`);

      const volumesHtml = manga.volumes.length
        ? manga.volumes.map(v => `
            <div class="chapter-row">
              <div class="chapter-info">
                <h4>جلد ${escapeHtml(v.number)}</h4>
              </div>
              <div class="chapter-actions">${actionsHtml(v)}</div>
            </div>
          `).join('')
        : `<p class="empty-state">هنوز جلدی برای این مانگا اضافه نشده.</p>`;

      pageContent.innerHTML = `
        <section class="manga-header">
          <div class="manga-header-cover">
            ${manga.cover ? `<img src="${escapeHtml(mediaUrl(manga.cover))}" alt="${escapeHtml(manga.title)}">` : '📓'}
          </div>
          <div class="manga-header-info">
            <h1>${escapeHtml(manga.title)}</h1>
            ${manga.title_fa ? `<h2>${escapeHtml(manga.title_fa)}</h2>` : ''}
            <div class="genre-tags">${genresHtml}</div>
            <p class="chapter-count">${countText}</p>
            ${metaParts.length ? `<p class="manga-meta">${metaParts.join(' · ')}</p>` : ''}
            ${manga.description ? `<p class="manga-description">${escapeHtml(manga.description)}</p>` : ''}
          </div>
        </section>

        <section class="chapters-section">
          <h3>جلدها</h3>
          <div class="chapters-list">${volumesHtml}</div>
        </section>
      `;
    }

    init();
  </script>

  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
